name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # As duas pontas do que o `composer.json` promete. Testar só a mais
        # nova deixaria passar sintaxe que o piso não entende — e o piso é o
        # que alguns produtos da casa ainda rodam.
        php: ['8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/phpunit
